<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediathek Movie Catalog</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --badge-bg: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            color: var(--accent-color);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            max-width: 450px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .filter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-color);
            color: #0b1120;
            border-color: var(--accent-color);
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: #0f172a;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rating-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(15, 23, 42, 0.85);
            color: #f59e0b;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .movie-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            line-height: 1.3;
        }

        .genre-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .genre-badge {
            background-color: var(--badge-bg);
            color: var(--accent-color);
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 8px;
            font-weight: 600;
        }

        .load-more-container {
            text-align: center;
            margin: 40px 0;
        }

        .load-more-btn {
            background-color: var(--accent-color);
            color: #0b1120;
            border: none;
            padding: 14px 32px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }

        .load-more-btn:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
            transform: scale(1.03);
        }

        .load-more-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mediathek Catalog</h1>

            <div class="filter-container" id="genreButtons">

            </div>
        </div>
    </header>

    <div class="movie-grid" id="movieGrid"></div>

    <div class="load-more-container">
        <button id="loadMoreBtn" class="load-more-btn" onclick="loadNextChunk()">Load More Movies</button>
    </div>

    <script>
        // =========================================================================
        // 🔑 INSERT YOUR TMDB API KEY HERE:
        // =========================================================================
        const TMDB_API_KEY = '6c4ce584e3f4e9692145b5ae821a2d87';

        const SCAN_BATCH_SIZE = 25; // Number of movies scanned per "Load More" click
        let allMovies = [];
        let scanIndex = 0;
        let selectedGenre = 'all';
        const activeGenres = new Set();
        const renderedMovieIds = new Set();

        function initApp() {
            if (typeof pelisData === 'undefined') {
                document.getElementById('statsText').innerText = 
                    "Error: Could not find pelis.js. Ensure pelis.js is in the same folder as index.html";
                return;
            }

            const watched = pelisData.movies?.cH || [];
            const watchlist = pelisData.movies?.cW || [];
            allMovies = [...watched, ...watchlist];

            loadNextChunk();
        }

        async function loadNextChunk() {
            const loadBtn = document.getElementById('loadMoreBtn');
            loadBtn.disabled = true;
            loadBtn.innerText = "Scanning & Loading...";

            const chunk = allMovies.slice(scanIndex, scanIndex + SCAN_BATCH_SIZE);
            scanIndex += chunk.length;

            // Fetch details for all movies in this batch simultaneously
            await Promise.all(chunk.map(movie => fetchTMDBDetails(movie)));

            // Render matching items into the grid
            renderMatchingMovies();

            loadBtn.disabled = false;
            updateUIState();
        }

        async function fetchTMDBDetails(movie) {
            if (movie.fetched || !TMDB_API_KEY || TMDB_API_KEY === 'YOUR_TMDB_API_KEY_HERE') return;

            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${movie.tmId}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();

                movie.fetched = true;
                movie.posterPath = data.poster_path;
                movie.voteAverage = data.vote_average;
                movie.genres = [];
                movie.rawGenres = data.genres || [];

                if (data.genres && data.genres.length > 0) {
                    data.genres.forEach(g => {
                        const slug = g.name.toLowerCase().replace(/\s+/g, '-');
                        movie.genres.push(slug);

                        if (!activeGenres.has(g.name)) {
                            activeGenres.add(g.name);
                            createGenreButton(g.name, slug);
                        }
                    });
                }
            } catch (err) {
                console.error(`Failed TMDB request for ID ${movie.tmId}:`, err);
            }
        }

        function renderMatchingMovies() {
            const grid = document.getElementById('movieGrid');
            const query = document.getElementById('searchInput').value.toLowerCase();

            // Check processed movies up to scanIndex
            const processedMovies = allMovies.slice(0, scanIndex);

            processedMovies.forEach(movie => {
                const titleMatch = movie.t.toLowerCase().includes(query);
                const genreMatch = selectedGenre === 'all' || (movie.genres && movie.genres.includes(selectedGenre));

                if (titleMatch && genreMatch) {
                    if (!renderedMovieIds.has(movie.tmId)) {
                        renderedMovieIds.add(movie.tmId);
                        const card = createCardElement(movie);
                        grid.appendChild(card);
                    }
                }
            });
        }

        function createCardElement(movie) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.id = `card-${movie.tmId}`;

            const posterSrc = movie.posterPath 
                ? `https://image.tmdb.org/t/p/w500${movie.posterPath}`
                : `https://via.placeholder.com/500x750/1e293b/38bdf8?text=No+Poster`;

            const rating = movie.voteAverage ? `★ ${movie.voteAverage.toFixed(1)}` : `★ --`;

            let genreBadges = `<span class="genre-badge">...</span>`;
            if (movie.rawGenres && movie.rawGenres.length > 0) {
                genreBadges = movie.rawGenres.map(g => `<span class="genre-badge">${g.name}</span>`).join('');
            }

            card.innerHTML = `
                <div class="poster-wrapper">
                    <img src="${posterSrc}" alt="${movie.t}">
                    <div class="rating-badge">${rating}</div>
                </div>
                <div class="movie-info">
                    <h3 class="movie-title">${movie.t}</h3>
                    <div class="genre-list">${genreBadges}</div>
                </div>
            `;

            return card;
        }

        function createGenreButton(name, slug) {
            const btnContainer = document.getElementById('genreButtons');
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.innerText = name;
            btn.onclick = (e) => setGenre(slug, e);
            btnContainer.appendChild(btn);
        }

        function setGenre(slug, event) {
            selectedGenre = slug;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (event) event.target.classList.add('active');
            reapplyFilters();
        }

        function onSearchChange() {
            reapplyFilters();
        }

        function reapplyFilters() {
            document.getElementById('movieGrid').innerHTML = '';
            renderedMovieIds.clear();
            renderMatchingMovies();
            updateUIState();
        }

        function updateUIState() {
            const loadBtn = document.getElementById('loadMoreBtn');
            const remaining = allMovies.length - scanIndex;

            if (remaining > 0) {
                loadBtn.style.display = 'inline-block';
                loadBtn.innerText = `Load More (Scan Next ${Math.min(SCAN_BATCH_SIZE, remaining)} Movies)`;
            } else {
                loadBtn.style.display = 'none';
            }

            const visibleCards = document.querySelectorAll('.movie-card').length;
            const statsEl = document.getElementById('statsText');
            statsEl.innerText = `Showing ${visibleCards} movies (Scanned ${scanIndex} of ${allMovies.length} total)`;
        }

        window.onload = initApp;
    </script>
